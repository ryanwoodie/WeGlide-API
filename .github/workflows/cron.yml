name: Trigger Leaderboard Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 16-23 * * *'
    - cron: '*/5 0-6 * * *'
    - cron: '*/30 6-16 * * *'
  workflow_dispatch:

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Endpoint
        env:
          TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: curl -X POST https://sac-leaderboard.vercel.app/api/trigger-update -H "x-update-token: $TOKEN" --fail