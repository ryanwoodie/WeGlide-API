name: Publish Mock AU Leaderboard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'bhc_au_sample/index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p _site/mock-au
          cp bhc_au_sample/index.html _site/mock-au/index.html
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>WeGlide Mock Pages</title>
              <style>
                  body {
                      margin: 0;
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                      background: #0f172a;
                      color: #e2e8f0;
                      min-height: 100vh;
                      display: grid;
                      place-items: center;
                  }
                  main {
                      width: min(720px, calc(100vw - 32px));
                      background: #111827;
                      border: 1px solid #334155;
                      border-radius: 16px;
                      padding: 32px;
                      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
                  }
                  h1 {
                      margin-top: 0;
                      font-size: 2rem;
                  }
                  p {
                      color: #cbd5e1;
                      line-height: 1.5;
                  }
                  a {
                      color: #f59e0b;
                      font-weight: 600;
                      text-decoration: none;
                  }
                  a:hover,
                  a:focus {
                      text-decoration: underline;
                  }
              </style>
          </head>
          <body>
              <main>
                  <h1>WeGlide Mock Pages</h1>
                  <p>This GitHub Pages site hosts preview-only leaderboard pages that are kept separate from the production Vercel deployment.</p>
                  <p><a href="./mock-au/">Open the Mock Leaderboard - Using Australian Data</a></p>
              </main>
          </body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
