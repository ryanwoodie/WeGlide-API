name: Update Leaderboard

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 03:00 UTC for a deep check
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Endpoint
        env:
          TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          curl -X POST https://sac-leaderboard.vercel.app/api/trigger-update \
          -H "x-update-token: $TOKEN" \
          --fail