name: Update Leaderboard

on:
  schedule:
    # Run Monday-Saturday. Sunday is handled by the weekly full refresh.
    - cron: '0 3 * * 1-6'
  workflow_dispatch:

# Belt-and-braces: never let two runs pile up.
concurrency:
  group: update-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Endpoint
        env:
          TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          : "${TOKEN:?UPDATE_TOKEN secret is required}"
          curl -X POST "https://sac-leaderboard.vercel.app/api/trigger-update?source=github-daily" \
            -H "x-update-token: $TOKEN" \
            --fail
